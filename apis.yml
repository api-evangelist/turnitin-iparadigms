aid: turnitin-iparadigms
name: Turnitin (iParadigms)
description: >-
  Turnitin (iParadigms) is an education-technology company providing academic
  integrity, similarity checking, and grading products used by schools,
  universities, researchers, and publishers worldwide. Turnitin exposes two
  programmatic integration surfaces for third-party platforms: a 1EdTech-certified
  Learning Tools Interoperability (LTI 1.3 / LTI Advantage) integration, and the
  Turnitin Core API (TCA) — a RESTful API that lets a platform submit files,
  generate Similarity Reports, and display results in-workflow without leaving the
  host learning environment. The TCA reference documentation is credential-gated;
  access is granted to existing customers and approved integration partners.
  Turnitin states SOC 2 compliance and operates international data centers.
  Gradescope is a Turnitin company. Backed by Insight Partners.
